[project]
name = "market-analyst-sim"
version = "0.1.0"
description = "Market Analyst Simulation MVP — a throwaway showcase of AI immersive learning for Regent Business School"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "sqlalchemy==2.0.36",
    "pyyaml==6.0.2",
    "openai==1.59.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
